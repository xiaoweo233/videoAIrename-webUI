<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b1020" />
  <title>工作台 · 视频 AI 重命名助手</title>
  <meta name="description" content="拖入一个文件夹，自动看懂每个视频讲了什么，重命名、写元数据、生成 NFO/SRT。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d8bff'/%3E%3Cpath d='M11 10l10 6-10 6z' fill='%23fff'/%3E%3C/svg%3E" />

  <!-- 关键 CSS 内联：保证首屏立即渲染，避免 FOUC / CLS -->
  <style>
    :root, [data-theme="dark"] {
      --bg-0:#070a12; --bg-1:#0b1020; --text:#e8edfb; --text-dim:#9aa6c4; --text-mute:#6b7699;
      --border:rgba(255,255,255,.08); --glass-bg:rgba(18,24,42,.55); --glass-border:rgba(255,255,255,.10);
      --glass-hi:rgba(255,255,255,.08); --accent:#6d8bff; --accent-2:#43d6c8;
      --ok:#3ddc97; --warn:#ffc857; --err:#ff6b81;
      --radius:16px; --ease:cubic-bezier(.22,1,.36,1);
    }
    [data-theme="light"] {
      --bg-0:#eef2fb; --bg-1:#f7f9ff; --text:#101728; --text-dim:#4a5573; --text-mute:#7c86a3;
      --border:rgba(16,24,40,.10); --glass-bg:rgba(255,255,255,.66); --glass-border:rgba(255,255,255,.9);
      --glass-hi:rgba(255,255,255,.9); --accent:#3b62ff; --accent-2:#12a89a;
      --ok:#12a05c; --warn:#b7791f; --err:#d6455d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); background: var(--bg-0);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    .view-root { flex: 1 1 auto; min-height: 0; }
    .boot-bar { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 60;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
      transform: translateX(-100%); animation: boot-slide 1.1s var(--ease) infinite; }
    @keyframes boot-slide { to { transform: translateX(100%); } }
    .skeleton-row { height: 14px; border-radius: 8px; margin: 12px 0;
      background: linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.14) 37%, rgba(255,255,255,.06) 63%);
      background-size: 400% 100%; animation: shimmer 1.4s linear infinite; }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  </style>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="boot-bar" id="boot-bar" aria-hidden="true"></div>

  <div id="app">
    <!-- 顶栏 -->
    <header class="topbar glass">
      <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="切换导航菜单" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4z"/><path d="M17 9l3-2v10l-3-2z"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">视频 AI 重命名助手</span>
          <span class="brand-sub">VAIR · Web 外壳</span>
        </span>
      </div>
      <div class="topbar-actions">
        <span class="conn-status is-warn" id="conn-status" role="status" aria-live="polite">
          <span class="conn-dot" aria-hidden="true"></span>
          <span class="conn-text">连接中…</span>
        </span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深色/浅色主题" title="切换深色/浅色主题">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <!-- 主体 -->
    <div class="layout">
      <aside class="sidebar glass" id="sidebar">
        <nav class="sidebar-nav" aria-label="主导航">
          <span class="nav-indicator" id="nav-indicator" aria-hidden="true"></span>
          <a class="nav-item" data-route="dashboard" href="#/dashboard">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
            <span class="nav-label">工作台</span>
          </a>
          <a class="nav-item" data-route="live" href="#/live">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg></span>
            <span class="nav-label">实时进度</span>
          </a>
          <a class="nav-item" data-route="review" href="#/review">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
            <span class="nav-label">命名审批</span>
          </a>
          <a class="nav-item" data-route="logs" href="#/logs">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg></span>
            <span class="nav-label">运行日志</span>
          </a>
          <a class="nav-item" data-route="settings" href="#/settings">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6.6 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13.6H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.7 7L4.6 7a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.4V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/></svg></span>
            <span class="nav-label">设置</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <span class="foot-note">产物全部落在应用目录内 · 卸载即删文件夹</span>
        </div>
      </aside>

      <div class="nav-scrim" id="nav-scrim" hidden></div>

      <main class="content">
        <div class="view-root" id="view-root">
          <!-- 首屏骨架，视图挂载后立即替换，避免 CLS -->
          <section class="panel">
            <div class="skeleton-row" style="width: 30%"></div>
            <div class="skeleton-row" style="width: 60%"></div>
            <div class="skeleton-row" style="width: 90%; height: 120px"></div>
            <div class="skeleton-row" style="width: 45%"></div>
          </section>
        </div>
      </main>
    </div>

    <!-- 移动端底部导航 -->
    <nav class="bottomnav glass" aria-label="底部导航">
      <a class="bottomnav-item" data-route="dashboard" href="#/dashboard"><span>工作台</span></a>
      <a class="bottomnav-item" data-route="live" href="#/live"><span>进度</span></a>
      <a class="bottomnav-item" data-route="review" href="#/review"><span>审批</span></a>
      <a class="bottomnav-item" data-route="logs" href="#/logs"><span>日志</span></a>
      <a class="bottomnav-item" data-route="settings" href="#/settings"><span>设置</span></a>
    </nav>
  </div>

  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
